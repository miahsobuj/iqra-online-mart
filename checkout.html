<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Iqra Online Mart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="topbar">
        <div class="container topbar-inner">
            <div class="topbar-info">
                <span><i class="fas fa-phone"></i> +880 1234 567890</span>
                <span><i class="fas fa-envelope"></i> support@iqramart.com</span>
            </div>
            <div class="topbar-actions">
                <div class="lang-selector">
                    <button id="langBtn" class="lang-btn"><i class="fas fa-globe"></i> English <i class="fas fa-chevron-down" style="font-size:0.7rem"></i></button>
                    <div id="langDropdown" class="lang-dropdown">
                        <button data-lang="en" class="lang-option active">🇬🇧 English</button>
                        <button data-lang="ur" class="lang-option">🇵🇰 اردو</button>
                        <button data-lang="ar" class="lang-option">�🇦 العربية</button>
                        <button data-lang="es" class="lang-option">🇪🇸 Español</button>
                        <button data-lang="bn" class="lang-option">🇧🇩 বাংলা</button>
                    </div>
                </div>
                <button id="themeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-mark">I</div>
                <div>
                    <div class="logo-text">Iqra Mart</div>
                    <div class="logo-sub">Online Shopping</div>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#products">Products</a></li>
                    <li><a href="index.html#categories">Categories</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="cartBtn" class="icon-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge badge" style="display:none">0</span>
                </button>
                <button id="mobileMenuBtn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <!-- Checkout -->
    <section class="section">
        <div class="container">
            <div class="section-header">
                <div class="section-tag">Checkout</div>
                <h2 class="section-title">Complete Your <span class="gradient-text">Order</span></h2>
            </div>
            <div class="checkout-grid">
                <div id="checkoutFormContainer"></div>
                <div id="checkoutSummary" class="checkout-summary"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top:none;padding-top:0;">
                <div>© 2026 Iqra Online Mart. All rights reserved.</div>
                <div class="footer-bottom-links">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
