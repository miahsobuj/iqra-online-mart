<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure Checkout · Iqra Online Mart">
  <meta name="theme-color" content="#09090d">
  <title>Checkout · Iqra Online Mart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-info">
        <span><svg class="svg-icon gold" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" fill="none"/></svg> 256-Bit Encrypted Secure Checkout</span>
      </div>
      <div class="topbar-actions">
        <!-- Currency Dropdown -->
        <div class="select-dropdown-wrap" id="currencyDropdownWrap">
          <button class="select-trigger-btn" id="currencyBtn">
            <span class="gold">🪙</span> <span id="currentCurrencyLabel">BDT (৳)</span> <span style="font-size:0.65rem">▼</span>
          </button>
          <div class="dropdown-menu">
            <button class="dropdown-item currency-option active" data-cur="BDT"><span>BDT</span> <strong>৳</strong></button>
            <button class="dropdown-item currency-option" data-cur="USD"><span>USD</span> <strong>$</strong></button>
            <button class="dropdown-item currency-option" data-cur="EUR"><span>EUR</span> <strong>€</strong></button>
            <button class="dropdown-item currency-option" data-cur="GBP"><span>GBP</span> <strong>£</strong></button>
            <button class="dropdown-item currency-option" data-cur="SAR"><span>SAR</span> <strong>﷼</strong></button>
            <button class="dropdown-item currency-option" data-cur="AED"><span>AED</span> <strong>د.إ</strong></button>
            <button class="dropdown-item currency-option" data-cur="INR"><span>INR</span> <strong>₹</strong></button>
          </div>
        </div>

        <button id="themeToggle" class="icon-btn" style="width:32px;height:32px;font-size:0.85rem" title="Toggle Theme">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">I</div>
        <div>
          <div class="logo-text">Iqra Mart</div>
          <div class="logo-sub">Express Settlement</div>
        </div>
      </a>
      <div class="header-actions">
        <a href="index.html#products" class="btn btn-outline btn-sm">← Continue Shopping</a>
        <a href="account.html" class="icon-btn" title="Account"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" stroke="currentColor" stroke-width="2" fill="none"/></svg></a>
      </div>
    </div>
  </header>

  <!-- Checkout Section -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <div class="section-tag">Express Settlement</div>
        <h2 class="section-title">Finalize Your <span class="gradient-text">Order</span></h2>
      </div>

      <div class="checkout-grid">
        <div id="checkoutFormContainer"></div>
        <div id="checkoutSummary" class="checkout-summary"></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-bottom" style="border:0;padding:0">
        <div>© 2026 Iqra Online Mart · SSL Protected Order Engine</div>
        <div class="footer-bottom-links">
          <a href="contact.html">Support Hotline: +880 1617 040846</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
