<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · Iqra Mart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="index.html" class="logo"><div class="logo-mark">I</div><div class="logo-text">Iqra Mart</div></a>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
      <button id="accountBtn" class="icon-btn"><i class="fas fa-user"></i></button>
    </div>
  </div></header>
  <section class="section"><div class="container">
    <div class="section-header"><div class="section-tag">Checkout</div><h2 class="section-title">Complete your <span class="gradient-text">order</span></h2></div>
    <div class="checkout-grid">
      <div id="checkoutFormContainer"></div>
      <div id="checkoutSummary" class="checkout-summary"></div>
    </div>
  </div></section>
  <div id="authModal" class="modal"><div class="modal-content">
    <button id="authClose" class="modal-close"><i class="fas fa-times"></i></button>
    <div class="auth-tabs"><button class="auth-tab active" data-tab="login">Sign in</button><button class="auth-tab" data-tab="register">Register</button></div>
    <form id="loginForm" class="auth-form" data-pane="login">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" required></div>
      <button class="btn" style="width:100%">Sign in</button>
    </form>
    <form id="registerForm" class="auth-form" data-pane="register" style="display:none">
      <div class="form-row"><div class="form-group"><label class="form-label">First</label><input class="form-input" name="firstName" required></div>
      <div class="form-group"><label class="form-label">Last</label><input class="form-input" name="lastName" required></div></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" name="phone"></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" required></div>
      <div class="form-group"><label class="form-label">Confirm</label><input class="form-input" name="confirmPassword" type="password" required></div>
      <button class="btn" style="width:100%">Register</button>
    </form>
  </div></div>
  <script src="script.js"></script>
</body>
</html>
