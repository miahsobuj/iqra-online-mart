<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer Account & Order Tracking · Iqra Online Mart">
  <meta name="theme-color" content="#09090d">
  <title>Customer Space · Iqra Online Mart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-info">
        <span><svg class="svg-icon gold" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Client Portal & Parcel Tracking</span>
      </div>
      <div class="topbar-actions">
        <!-- Currency Dropdown -->
        <div class="select-dropdown-wrap" id="currencyDropdownWrap">
          <button class="select-trigger-btn" id="currencyBtn">
            <span class="gold">🪙</span> <span id="currentCurrencyLabel">BDT (৳)</span> <span style="font-size:0.65rem">▼</span>
          </button>
          <div class="dropdown-menu">
            <button class="dropdown-item currency-option active" data-cur="BDT"><span>BDT</span> <strong>৳</strong></button>
            <button class="dropdown-item currency-option" data-cur="USD"><span>USD</span> <strong>$</strong></button>
            <button class="dropdown-item currency-option" data-cur="EUR"><span>EUR</span> <strong>€</strong></button>
            <button class="dropdown-item currency-option" data-cur="GBP"><span>GBP</span> <strong>£</strong></button>
            <button class="dropdown-item currency-option" data-cur="SAR"><span>SAR</span> <strong>﷼</strong></button>
            <button class="dropdown-item currency-option" data-cur="AED"><span>AED</span> <strong>د.إ</strong></button>
            <button class="dropdown-item currency-option" data-cur="INR"><span>INR</span> <strong>₹</strong></button>
          </div>
        </div>

        <button id="themeToggle" class="icon-btn" style="width:32px;height:32px;font-size:0.85rem" title="Toggle Theme">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">I</div>
        <div>
          <div class="logo-text">Iqra Mart</div>
          <div class="logo-sub">Client Space</div>
        </div>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#products">Products</a></li>
          <li><a href="blog.html">Journal</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button id="cartBtn" class="icon-btn" title="Bag"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span class="cart-badge" style="display:none">0</span></button>
      </div>
    </div>
  </header>

  <!-- Account Portal Root -->
  <section class="section">
    <div class="container">
      <div class="section-header">
        <div class="section-tag">Member Workspace</div>
        <h2 class="section-title">Your Private <span class="gradient-text">Space</span></h2>
      </div>
      <div id="accountRoot"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-bottom" style="border:0;padding:0">
        <div>© 2026 Iqra Online Mart · Member Services</div>
        <div class="footer-bottom-links">
          <a href="index.html">Storefront</a>
          <a href="contact.html">Support</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Slide-Over Shopping Cart Drawer -->
  <div id="cartDrawerOverlay" class="cart-drawer-overlay"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header">
      <h3><svg class="svg-icon gold" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg> Shopping Bag</h3>
      <button id="cartClose" class="modal-close" style="position:static"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
    <div id="freeShippingBox" class="free-shipping-box"></div>
    <div class="cart-drawer-body" id="cartDrawerBody"></div>
    <div class="cart-drawer-footer">
      <div class="cart-total-row grand-total"><span>Total</span><span class="gold" id="cartTotalValue">৳0</span></div>
      <button id="checkoutBtn" class="btn btn-lg" style="width:100%"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" fill="none"/></svg> Checkout</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <button id="authClose" class="modal-close" data-close-modal><svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
      <div style="display:flex;gap:1rem;margin-bottom:1.5rem;border-bottom:1px solid var(--line-faint)">
        <button class="pd-tab-btn active" id="authTabLogin" onclick="$$('.auth-form').forEach(f=>f.style.display='none');$('#loginForm').style.display='block';this.classList.add('active');$('#authTabReg').classList.remove('active')">Sign In</button>
        <button class="pd-tab-btn" id="authTabReg" onclick="$$('.auth-form').forEach(f=>f.style.display='none');$('#registerForm').style.display='block';this.classList.add('active');$('#authTabLogin').classList.remove('active')">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" name="email" type="email" required></div>
        <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" required></div>
        <button class="btn" style="width:100%;margin-top:1rem">Sign In</button>
      </form>

      <form id="registerForm" class="auth-form" style="display:none">
        <div class="form-row">
          <div class="form-group"><label class="form-label">First Name</label><input class="form-input" name="firstName" required></div>
          <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" name="lastName" required></div>
        </div>
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required></div>
        <div class="form-group"><label class="form-label">Mobile Phone</label><input class="form-input" name="phone"></div>
        <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" minlength="4" required></div>
        <button class="btn" style="width:100%;margin-top:1rem">Create Account</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
