<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CMS Login · Iqra Online Mart">
  <meta name="theme-color" content="#09090d">
  <title>CMS Portal Login · Iqra Mart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page" style="display:grid;place-items:center;min-height:100vh;padding:1.5rem">

  <div class="checkout-card" style="width:min(440px, 100%);padding:2.5rem 2rem;text-align:center">
    <div class="logo-mark" style="width:58px;height:58px;font-size:1.8rem;margin:0 auto 1.25rem">I</div>
    <h1 style="font-family:var(--serif);font-size:2rem;margin-bottom:0.35rem">Iqra CMS Desk</h1>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:2rem">Secure house ledger & inventory management</p>

    <form id="loginForm" style="text-align:left">
      <div class="form-group">
        <label class="form-label">Admin Username</label>
        <input class="form-input" name="username" id="adminUserField" value="admin" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" name="password" id="adminPassField" type="password" value="admin123" required>
      </div>

      <button class="btn btn-lg" style="width:100%;margin-top:1.25rem"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" fill="none"/></svg> Enter Dashboard</button>
    </form>

    <div style="background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0.75rem;margin-top:1.5rem;font-size:0.8rem;color:var(--muted)">
      Demo Access · <code>admin</code> / <code>admin123</code>
    </div>

    <div style="margin-top:1.5rem">
      <a href="index.html" class="btn-ghost btn-sm">← Return to Storefront</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
