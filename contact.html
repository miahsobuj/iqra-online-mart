<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · Iqra Mart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="index.html" class="logo"><div class="logo-mark">I</div><div class="logo-text">Iqra Mart</div></a>
    <nav><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="blog.html">Journal</a></li><li><a href="contact.html" class="active">Contact</a></li></ul></nav>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
      <button id="cartBtn" class="icon-btn"><i class="fas fa-bag-shopping"></i><span class="cart-badge" style="display:none">0</span></button>
      <button id="accountBtn" class="icon-btn"><i class="fas fa-user"></i></button>
      <button id="mobileMenuBtn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    </div>
  </div></header>
  <section class="section"><div class="container">
    <div class="section-header"><div class="section-tag">Contact</div><h2 class="section-title">A note to the <span class="gradient-text">house</span></h2></div>
    <div class="contact-grid">
      <div class="info-card">
        <h3>Visit</h3>
        <p style="color:var(--muted);margin:.6rem 0 1rem"><span data-cms="address">Savar, Dhaka, Bangladesh</span></p>
        <p><i class="fas fa-phone gold"></i> <span data-cms="phone">01617040846</span></p>
        <p style="margin-top:.4rem"><i class="fas fa-envelope gold"></i> <span data-cms="email">iqrabintesobuj@gmail.com</span></p>
      </div>
      <form id="contactForm" class="info-card">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Name</label><input class="form-input" name="name" required></div>
          <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required></div>
        </div>
        <div class="form-group"><label class="form-label">Subject</label><input class="form-input" name="subject" required></div>
        <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" name="message" required></textarea></div>
        <button class="btn">Send message</button>
      </form>
    </div>
  </div></section>
  <div id="cartDrawerOverlay" class="cart-drawer-overlay"></div>
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-drawer-header"><h3>Bag</h3><button id="cartClose" class="modal-close"><i class="fas fa-times"></i></button></div>
    <div class="cart-drawer-body" id="cartDrawerBody"></div>
    <div class="cart-drawer-footer"><div class="cart-total-row"><span>Total</span><span class="total" id="cartTotalValue">৳0</span></div>
      <button id="checkoutBtn" class="btn btn-lg" style="width:100%">Checkout</button></div>
  </div>
  <div id="authModal" class="modal"><div class="modal-content">
    <button id="authClose" class="modal-close"><i class="fas fa-times"></i></button>
    <div class="auth-tabs"><button class="auth-tab active" data-tab="login">Sign in</button><button class="auth-tab" data-tab="register">Register</button></div>
    <form id="loginForm" class="auth-form" data-pane="login">
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" required></div>
      <button class="btn" style="width:100%">Sign in</button>
    </form>
    <form id="registerForm" class="auth-form" data-pane="register" style="display:none">
      <div class="form-row"><div class="form-group"><label class="form-label">First</label><input class="form-input" name="firstName" required></div>
      <div class="form-group"><label class="form-label">Last</label><input class="form-input" name="lastName" required></div></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" name="email" type="email" required></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" name="phone"></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" name="password" type="password" required></div>
      <div class="form-group"><label class="form-label">Confirm</label><input class="form-input" name="confirmPassword" type="password" required></div>
      <button class="btn" style="width:100%">Register</button>
    </form>
  </div></div>
  <script src="script.js"></script>
</body>
</html>
